<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPSE Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#0f172a;
height:100vh;
display:flex;
flex-direction:column;
}

.logo{
text-align:center;
padding:15px;
color:white;
font-size:15px;
font-weight:600;
background:#111827;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:8px;
}

.msg{
padding:10px 14px;
border-radius:16px;
max-width:75%;
font-size:14px;
word-wrap:break-word;
}

.sent{
align-self:flex-end;
background:#2563eb;
color:white;
}

.received{
align-self:flex-start;
background:#374151;
color:white;
}

.bottom{
display:flex;
gap:10px;
padding:10px;
background:#111827;
}

#message{
flex:1;
padding:12px;
border:none;
outline:none;
border-radius:25px;
font-size:14px;
}

button{
padding:12px 20px;
border:none;
border-radius:25px;
cursor:pointer;
font-weight:600;
}

</style>
</head>

<body>

<div class="logo">
RPSE Exam ki jankari ke liye sawal puche
</div>

<div id="chat"></div>

<div class="bottom">
<input id="message" placeholder="Message...">
<button onclick="sendMessage()">Send</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js"></script>

<script>

const socket = io("https://duggu.onrender.com",{
transports:["websocket","polling"]
});

const myId=Math.random().toString(36).substring(2);

function addMessage(text,type){

const div=document.createElement("div");

div.className=`msg ${type}`;

div.innerText=text;

document.getElementById("chat").appendChild(div);

document.getElementById("chat").scrollTop=
document.getElementById("chat").scrollHeight;

}

function sendMessage(){

const input=document.getElementById("message");

const msg=input.value.trim();

if(!msg) return;

addMessage(msg,"sent");

socket.emit("send_message",{
text:msg,
sender:myId
});

input.value="";
}

document.getElementById("message").addEventListener("keypress",(e)=>{
if(e.key==="Enter"){
sendMessage();
}
});

socket.on("receive_message",(data)=>{

if(data.sender===myId) return;

addMessage(data.text,"received");

});

</script>

</body>
</html>
