<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPSE RAJASTHAN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#0f172a;
min-height:100dvh;
overflow-y:auto;
}

#loginPage{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0f172a;
}

.login-box{
width:90%;
max-width:350px;
background:#111827;
padding:25px;
border-radius:20px;
text-align:center;
}

.login-box h2{
color:white;
margin-bottom:10px;
}

.login-box p{
color:#9ca3af;
margin-bottom:20px;
font-size:14px;
}

.login-box input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#1f2937;
color:white;
margin-bottom:15px;
}

.login-box button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(135deg,#833ab4,#405de6);
color:white;
}

#error{
color:#ef4444;
margin-top:10px;
font-size:14px;
display:none;
}

#chatPage{
display:none;
height:100dvh;
width:100%;
flex-direction:column;
overflow:hidden;
}

.logo{
background:#111827;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
font-size:15px;
font-weight:600;
border-bottom:1px solid #1f2937;
}

#menuBtn{
background:none;
border:none;
color:white;
font-size:28px;
cursor:pointer;
font-weight:bold;
}

#menu{
display:none;
position:absolute;
top:60px;
right:10px;
background:#1f2937;
border-radius:12px;
overflow:hidden;
z-index:1000;
min-width:120px;
}

.menu-item{
padding:12px;
color:white;
cursor:pointer;
border-bottom:1px solid #374151;
}

.menu-item:last-child{
border-bottom:none;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

#chat::before{
content:"";
margin-top:auto;
}

.msg{
padding:12px 16px;
border-radius:22px;
max-width:80%;
font-size:14px;
word-wrap:break-word;
line-height:1.5;
}

.sent{
align-self:flex-end;
background:linear-gradient(135deg,#833ab4,#405de6);
color:white;
border-bottom-right-radius:8px;
}

.received{
align-self:flex-start;
background:#1f2937;
color:white;
border-bottom-left-radius:8px;
}

.time{
font-size:11px;
opacity:0.7;
margin-left:8px;
white-space:nowrap;
display:inline-block;
vertical-align:bottom;
}
.bottom{
display:flex;
gap:10px;
padding:10px;
background:#111827;
flex-shrink:0;
}

#message{
flex:1;
padding:14px;
border:none;
outline:none;
border-radius:25px;
background:#1f2937;
color:white;
}

.askBtn{
padding:14px 18px;
border:none;
border-radius:25px;
cursor:pointer;
background:linear-gradient(135deg,#833ab4,#405de6);
color:white;
font-weight:bold;
}

#teamPage{
display:none;
height:100dvh;
width:100%;
flex-direction:column;
overflow:hidden;
}

#teamChat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

#roseContainer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:9999;
}

.rose{
position:absolute;
top:-50px;
font-size:28px;
animation:fall 4s linear forwards;
}

@keyframes fall{
0%{
transform:translateY(-50px) rotate(0deg);
opacity:1;
}
100%{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}

@media(max-width:768px){

.msg{
max-width:88%;
}

.logo{
font-size:14px;
}

}

</style>
</head>

<body>

<div id="loginPage">

<div class="login-box">

<h2>📚 RPSE RAJASTHAN</h2>

<p>Password Enter Kare</p>

<input
type="password"
id="password"
placeholder="Password">

<button onclick="checkPassword()">
Login
</button>

<div id="error">
Access Denied
</div>

</div>

</div>
<div id="chatPage">

<div class="logo">

<span>
📚 Exam ki tayari ke liye question bheje
</span>

<button id="menuBtn">☰</button>
</div>

<div id="menu">

<div class="menu-item" onclick="showUser()">
User
</div>

<div class="menu-item"
onclick="openTeam()">
Team
</div>

<div class="menu-item" onclick="logout()">
Logout
</div>

</div>

<div id="chat"></div>

<div class="bottom">

<input
id="message"
placeholder="Apna swal type kre ...">

<button
class="askBtn"
onclick="sendMessage()">
Ask
</button>

</div>

</div>
<div id="teamPage">

<div class="logo">

<span>
📚 DugguBuggu
</span>

<button class="askBtn" onclick="goHome()">
Logout
</button>

</div>

<div id="teamChat"></div>

<div class="bottom">

<input
id="teamMessage"
placeholder="Message...">

<button
class="askBtn"
onclick="sendTeamMessage()">
Ask
</button>

</div>

</div>

<div id="roseContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js"></script>

<script>

let currentUser = "";

if(sessionStorage.getItem("loggedIn")){

currentUser = sessionStorage.getItem("loggedIn");

document.addEventListener("DOMContentLoaded",()=>{

document.getElementById("loginPage").style.display="none";

document.getElementById("chatPage").style.display="flex";

document.getElementById("chat").innerHTML="";

});

}

function checkPassword(){

const pass =
document.getElementById("password").value;

if(pass === "duggu1525"){

currentUser = "admin";

document.getElementById("loginPage").style.display="none";

document.getElementById("chatPage").style.display="flex";

sessionStorage.setItem("loggedIn","admin");

document.getElementById("chat").innerHTML="";

}

else if(pass === "buggu1525"){

currentUser = "duggu";

document.getElementById("loginPage").style.display="none";

document.getElementById("chatPage").style.display="flex";

sessionStorage.setItem("loggedIn","duggu");

document.getElementById("chat").innerHTML="";

}

else{

document.getElementById("error").style.display="block";

}

}

const socket = io("https://duggu.onrender.com",{
transports:["websocket","polling"]
});

const myId =
Math.random().toString(36).substring(2);

function addMessage(text,type){

const div =
document.createElement("div");

div.className =
`msg ${type}`;

const time =
new Date().toLocaleTimeString('en-US',{
hour:'numeric',
minute:'2-digit',
hour12:true
});

div.innerHTML = `
<span>${text}</span>
<span class="time">${time}</span>
`;

const chat =
document.getElementById("chat");

chat.appendChild(div);

chat.scrollTop =
chat.scrollHeight;

}

function sendMessage(){

const input =
document.getElementById("message");

const msg =
input.value.trim();

if(!msg) return;

addMessage(msg,"sent");

socket.emit("send_message",{
text:msg,
sender:myId
});

input.value="";
input.focus();

}

document
.getElementById("message")
.addEventListener("keypress",(e)=>{

if(e.key==="Enter"){

sendMessage();

}

});

socket.on(
"receive_message",
(data)=>{

if(data.sender===myId)
return;

addMessage(
data.text,
"received"
);

});

socket.on(
"receive_team_message",
(data)=>{

const div =
document.createElement("div");

div.className =
data.sender===currentUser
? "msg sent"
: "msg received";

div.innerHTML = `
<span>${data.text}</span>
`;

document
.getElementById("teamChat")
.appendChild(div);

});

const menuBtn =
document.getElementById("menuBtn");

menuBtn.addEventListener("click",()=>{

const menu =
document.getElementById("menu");

menu.style.display =
menu.style.display==="block"
? "none"
: "block";

});

function showUser(){

alert(
"Username: " +
(currentUser || "Unknown")
);

}

function logout(){

sessionStorage.clear();

location.reload();

}

function roseRain(){

for(let i=0;i<40;i++){

const rose =
document.createElement("div");

rose.className="rose";

rose.innerHTML="🌹";

rose.style.left =
Math.random()*100 + "vw";

rose.style.animationDelay =
Math.random()*2 + "s";

document
.getElementById("roseContainer")
.appendChild(rose);

setTimeout(()=>{
rose.remove();
},6000);

}

}

function openTeam(){

const pass =
prompt("Team Password Enter Kare");

if(pass !== "duggubuggu"){

alert("Wrong Password");

return;

}

alert("🥰 Congratulations Duggu 🥰");

roseRain();

setTimeout(async ()=>{

document.getElementById("chatPage").style.display="none";

document.getElementById("teamPage").style.display="flex";

document.getElementById("teamChat").innerHTML="";

const res =
await fetch(
"https://duggu.onrender.com/team-messages"
);

const messages =
await res.json();

messages.forEach((msg)=>{

const div =
document.createElement("div");

div.className =
msg.sender===currentUser
? "msg sent"
: "msg received";

div.innerHTML =
`<span>${msg.text}</span>`;

document
.getElementById("teamChat")
.appendChild(div);

});

},2500);

}

function goHome(){

document.getElementById("teamPage").style.display="none";

document.getElementById("chatPage").style.display="flex";

}

function sendTeamMessage(){

const input =
document.getElementById("teamMessage");

const msg =
input.value.trim();

if(!msg) return;

socket.emit("send_team_message",{
text:msg,
sender:currentUser
});

input.value="";

}

}

</script>

</body>
</html>
