<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duggu</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#0f172a;
height:100vh;
display:flex;
flex-direction:column;
}

.logo{
position:absolute;
top:20px;
right:20px;
color:white;
font-size:22px;
font-weight:bold;
letter-spacing:2px;
}

#chat{
flex:1;
overflow-y:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
background:#2563eb;
color:white;
padding:12px 15px;
border-radius:15px;
width:fit-content;
max-width:75%;
}

.bottom{
display:flex;
padding:10px;
gap:10px;
background:#111827;
}

#message{
flex:1;
padding:12px;
border:none;
border-radius:25px;
outline:none;
}

button{
padding:12px 20px;
border:none;
border-radius:25px;
cursor:pointer;
font-weight:bold;
}
</style>
</head>

<body>

<div class="logo">DUGGU</div>

<div id="chat"></div>

<div class="bottom">
<input id="message" placeholder="Type a message...">
<button onclick="sendMessage()">Send</button>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>
const socket = io("https://duggu.onrender.com");

function sendMessage(){

const msg=document.getElementById("message").value.trim();

if(!msg) return;

socket.emit("send_message",msg);

document.getElementById("message").value="";
}

socket.on("receive_message",(msg)=>{

const div=document.createElement("div");

div.className="msg";
div.innerText=msg;

document.getElementById("chat").appendChild(div);

document.getElementById("chat").scrollTop =
document.getElementById("chat").scrollHeight;

});
</script>

</body>
</html>
