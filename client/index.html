<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPSE RAJASTHAN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#0f172a;
min-height:100dvh;
overflow-y:auto;
}

#loginPage{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0f172a;
}

.login-box{
width:90%;
max-width:350px;
background:#111827;
padding:25px;
border-radius:20px;
text-align:center;
}

.login-box h2{
color:white;
margin-bottom:10px;
}

.login-box p{
color:#9ca3af;
margin-bottom:20px;
font-size:14px;
}

.login-box input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#1f2937;
color:white;
margin-bottom:15px;
}

.login-box button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(135deg,#833ab4,#405de6);
color:white;
}

#error{
color:#ef4444;
margin-top:10px;
font-size:14px;
display:none;
}

#chatPage{
display:none;
height:100dvh;
width:100%;
flex-direction:column;
overflow:hidden;
}

.logo{
background:#111827;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
font-size:15px;
font-weight:600;
border-bottom:1px solid #1f2937;
}

#menuBtn{
background:none;
border:none;
color:white;
font-size:28px;
cursor:pointer;
font-weight:bold;
}

#menu{
display:none;
position:absolute;
top:60px;
right:10px;
background:#1f2937;
border-radius:12px;
overflow:hidden;
z-index:1000;
min-width:120px;
}

.menu-item{
padding:12px;
color:white;
cursor:pointer;
border-bottom:1px solid #374151;
}

.menu-item:last-child{
border-bottom:none;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

#chat::before{
content:"";
margin-top:auto;
}

.msg{
padding:12px 16px;
border-radius:22px;
max-width:80%;
font-size:14px;
word-wrap:break-word;
line-height:1.5;
}

.sent{
align-self:flex-end;
background:linear-gradient(135deg,#833ab4,#405de6);
color:white;
border-bottom-right-radius:8px;
}

.received{
align-self:flex-start;
background:#1f2937;
color:white;
border-bottom-left-radius:8px;
}

.time{
font-size:11px;
opacity:0.7;
margin-left:8px;
white-space:nowrap;
display:inline-block;
vertical-align:bottom;
}
.bottom{
display:flex;
gap:10px;
padding:10px;
background:#111827;
flex-shrink:0;
}

#message{
flex:1;
padding:14px;
border:none;
outline:none;
border-radius:25px;
background:#1f2937;
color:white;
}

#teamMessage{
flex:1;
padding:14px;
border:none;
outline:none;
border-radius:25px;
background:#1f2937;
color:white;
}

.askBtn{
padding:14px 18px;
border:none;
border-radius:25px;
cursor:pointer;
background:linear-gradient(135deg,#833ab4,#405de6);
color:white;
font-weight:bold;
}

#teamPage{
display:none;
height:100dvh;
width:100%;
flex-direction:column;
overflow:hidden;
}

#teamChat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
justify-content:flex-end;
}

#teamChat::before{
content:"";
margin-top:auto;
}

#roseContainer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:9999;
}

#welcomeText{
display:none;
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:42px;
font-weight:700;
color:white;
text-align:center;
text-shadow:0 0 30px #ff69b4;
z-index:10001;
}

#teamLoginModal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
z-index:10000;
justify-content:center;
align-items:center;
}

.team-box{
width:90%;
max-width:350px;
background:#111827;
padding:25px;
border-radius:20px;
text-align:center;
}

.team-box h2{
color:white;
margin-bottom:10px;
}

.team-box input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#1f2937;
color:white;
margin:15px 0;
}

.teamError{
display:none;
color:#ef4444;
font-size:13px;
}

.rose{
position:absolute;
font-size:28px;
animation:floatRandom linear forwards;
}

@keyframes floatRandom{

0%{
transform:translate(0,0) rotate(0deg);
opacity:0;
}

10%{
opacity:1;
}

100%{
transform:
translate(var(--moveX),var(--moveY))
rotate(360deg);
opacity:0;
}

}

</style>
</head>

<body>

<div id="loginPage">

<div class="login-box">

<h2>📚 RPSE RAJASTHAN</h2>

<p>Password Enter Kare</p>

<input
type="password"
id="password"
placeholder="Password">

<button onclick="checkPassword()">
Login
</button>

<div id="error">
Access Denied
</div>

</div>

</div>
<div id="chatPage">

<div class="logo">

<span>
📚 Exam ki tayari ke liye question bheje
</span>

<button id="menuBtn">☰</button>
</div>

<div id="menu">

<div class="menu-item" onclick="showUser()">
User
</div>

<div class="menu-item"
onclick="openTeam()">
Team
</div>

<div class="menu-item" onclick="logout()">
Logout
</div>

</div>

<div id="chat"></div>

<div class="bottom">

<input
id="message"
placeholder="Apna swal type kre ...">

<button
class="askBtn"
onclick="sendMessage()">
Ask
</button>

</div>

</div>
<div id="teamPage">

<div class="logo">

<span>
📚 DugguBuggu
</span>

<button class="askBtn" onclick="goHome()">
Logout
</button>

</div>

<div id="teamChat"></div>

<div class="bottom">

<input
id="teamMessage"
placeholder="Message...">

<button
class="askBtn"
onclick="sendTeamMessage()">
Ask
</button>

</div>

</div>

<div id="roseContainer"></div>

<div id="welcomeText">
🥰 Congratulations Duggu 🥰
</div>

<div id="teamLoginModal">

<div class="team-box">

<h2>🥰 Team Access 🥰</h2>

<input
type="password"
id="teamPassword"
placeholder="Password">

<button
class="askBtn"
onclick="checkTeamPassword()">
Enter
</button>

<div
id="teamError"
class="teamError">
Wrong Password
</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js"></script>

<script>

let currentUser = "";

if(sessionStorage.getItem("loggedIn")){

currentUser = sessionStorage.getItem("loggedIn");

document.addEventListener("DOMContentLoaded",()=>{

document.getElementById("loginPage").style.display="none";

document.getElementById("chatPage").style.display="flex";

document.getElementById("chat").innerHTML="";

});

}
document
.getElementById("teamPassword")
.addEventListener("keypress",(e)=>{

if(e.key==="Enter"){

checkTeamPassword();

}

});

document
.getElementById("password")
.addEventListener("keypress",(e)=>{

if(e.key==="Enter"){

checkPassword();

}

});

function checkPassword(){

const pass =
document.getElementById("password").value;

if(pass === "duggu1525"){

currentUser = "admin";

document.getElementById("loginPage").style.display="none";

document.getElementById("chatPage").style.display="flex";

sessionStorage.setItem("loggedIn","admin");

document.getElementById("chat").innerHTML="";

}

else if(pass === "buggu1525"){

currentUser = "duggu";

document.getElementById("loginPage").style.display="none";

document.getElementById("chatPage").style.display="flex";

sessionStorage.setItem("loggedIn","duggu");

document.getElementById("chat").innerHTML="";

}

else{

document.getElementById("error").style.display="block";

}

}

const socket = io("https://duggu.onrender.com",{
transports:["websocket","polling"]
});

const myId =
Math.random().toString(36).substring(2);

function addMessage(text,type){

const div =
document.createElement("div");

div.className =
`msg ${type}`;

const time =
new Date().toLocaleTimeString('en-US',{
hour:'numeric',
minute:'2-digit',
hour12:true
});

div.innerHTML = `
<span>${text}</span>
<span class="time">${time}</span>
`;

const chat =
document.getElementById("chat");

chat.appendChild(div);

chat.scrollTop =
chat.scrollHeight;

}

function sendMessage(){

const input =
document.getElementById("message");

const msg =
input.value.trim();

if(!msg) return;

addMessage(msg,"sent");

socket.emit("send_message",{
text:msg,
sender:myId
});

input.value="";
input.focus();

}

document
.getElementById("message")
.addEventListener("keypress",(e)=>{

if(e.key==="Enter"){

sendMessage();

}

});

socket.on(
"receive_message",
(data)=>{

if(data.sender===myId)
return;

addMessage(
data.text,
"received"
);

});

socket.on(
"receive_team_message",
(data)=>{

if(data.sender === currentUser){
return;

}
const div =
document.createElement("div");

if(data.sender === currentUser){
div.className = "msg sent";
}
else{
div.className = "msg received";
}

const time =
new Date().toLocaleTimeString('en-US',{
hour:'numeric',
minute:'2-digit',
hour12:true
});

div.innerHTML = `
<span>${data.text}</span>
<span class="time">${time}</span>
`;

document
.getElementById("teamChat")
.appendChild(div);

});

const menuBtn =
document.getElementById("menuBtn");

menuBtn.addEventListener("click",()=>{

const menu =
document.getElementById("menu");

menu.style.display =
menu.style.display==="block"
? "none"
: "block";

});

function showUser(){

alert(
"Username: " +
(currentUser || "Unknown")
);

}

function logout(){

sessionStorage.clear();

location.reload();

}
function roseRain(){

const items=[
"🥰","😍","😘",
"💕","❤️",
"✨","💖","🥳"
];

for(let i=0;i<25;i++){

const item =
document.createElement("div");

item.className="rose";

item.innerHTML=
items[Math.floor(Math.random()*items.length)];

item.style.left =
Math.random()*100 + "vw";

item.style.top =
Math.random()*100 + "vh";

item.style.fontSize =
(18 + Math.random()*20) + "px";

item.style.animationDuration =
(6 + Math.random()*8) + "s";

const moveX =
Math.floor(Math.random()*300)-150;

const moveY =
Math.floor(Math.random()*300)-150;

item.style.setProperty('--moveX', moveX+'px');
item.style.setProperty('--moveY', moveY+'px');

document
.getElementById("roseContainer")
.appendChild(item);

setTimeout(()=>{
item.remove();
},14000);

}

}

function openTeam(){

document
.getElementById("teamLoginModal")
.style.display="flex";

}

async function checkTeamPassword(){

const pass =
document.getElementById("teamPassword").value;

if(pass !== "duggubuggu"){

document
.getElementById("teamError")
.style.display="block";

return;

}

document
.getElementById("teamLoginModal")
.style.display="none";

document
.getElementById("welcomeText")
.style.display="block";

roseRain();

const petalsInterval =
setInterval(()=>{
roseRain();
},3000);

setTimeout(()=>{
document
.getElementById("welcomeText")
.style.display="none";
},3000);

setTimeout(()=>{
clearInterval(petalsInterval);
},15000);

document.getElementById("chatPage").style.display="none";
document.getElementById("teamPage").style.display="flex";

document.getElementById("teamChat").innerHTML="";

const res =
await fetch(
"https://duggu.onrender.com/team-messages"
);

const messages =
await res.json();

messages.forEach((msg)=>{

const div =
document.createElement("div");

div.className =
msg.sender===currentUser
? "msg sent"
: "msg received";

const time =
new Date().toLocaleTimeString('en-US',{
hour:'numeric',
minute:'2-digit',
hour12:true
});

div.innerHTML=`
<span>${msg.text}</span>
<span class="time">${time}</span>
`;

document
.getElementById("teamChat")
.appendChild(div);

});
document
.getElementById("teamChat")
.scrollTop =
document
.getElementById("teamChat")
.scrollHeight;

}

function goHome(){

document.getElementById("teamPage").style.display="none";

document.getElementById("chatPage").style.display="flex";

}

function sendTeamMessage(){

const input =
document.getElementById("teamMessage");

const msg =
input.value.trim();

if(!msg) return;

const div =
document.createElement("div");

div.className="msg sent";

const time =
new Date().toLocaleTimeString('en-US',{
hour:'numeric',
minute:'2-digit',
hour12:true
});

div.innerHTML = `
<span>${msg}</span>
<span class="time">${time}</span>
`;

document
.getElementById("teamChat")
.appendChild(div);

socket.emit("send_team_message",{
text:msg,
sender:currentUser
});

input.value="";

document
.getElementById("teamChat")
.scrollTop=
document
.getElementById("teamChat")
.scrollHeight;

}

document
.getElementById("teamMessage")
.addEventListener("keypress",(e)=>{

if(e.key==="Enter"){

sendTeamMessage();

}

});

</script>

</body>
</html>
