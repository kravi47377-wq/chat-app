<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPSE Chat</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#0f172a;
height:100vh;
overflow:hidden;
}

#loginPage{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#0f172a;
}

.login-box{
width:90%;
max-width:350px;
background:#111827;
padding:25px;
border-radius:20px;
text-align:center;
}

.login-box h2{
color:white;
margin-bottom:10px;
}

.login-box p{
color:#9ca3af;
margin-bottom:20px;
font-size:14px;
}

.login-box input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#1f2937;
color:white;
margin-bottom:15px;
}

.login-box button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
background:linear-gradient(135deg,#833ab4,#405de6);
color:white;
}

#error{
color:#ef4444;
margin-top:10px;
font-size:14px;
display:none;
}

#chatPage{
display:none;
height:100vh;
flex-direction:column;
}

.logo{
background:#111827;
padding:15px;
text-align:center;
color:white;
font-size:15px;
font-weight:600;
border-bottom:1px solid #1f2937;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
padding:12px 16px;
border-radius:22px;
max-width:80%;
font-size:14px;
word-wrap:break-word;
line-height:1.5;
}

.sent{
align-self:flex-end;
background:linear-gradient(135deg,#833ab4,#405de6);
color:white;
border-bottom-right-radius:8px;
}

.received{
align-self:flex-start;
background:#1f2937;
color:white;
border-bottom-left-radius:8px;
}

.bottom{
display:flex;
gap:10px;
padding:10px;
background:#111827;
}

#message{
flex:1;
padding:14px;
border:none;
outline:none;
border-radius:25px;
background:#1f2937;
color:white;
}

.askBtn{
padding:14px 18px;
border:none;
border-radius:25px;
cursor:pointer;
background:linear-gradient(135deg,#833ab4,#405de6);
color:white;
font-weight:bold;
}

@media(max-width:768px){

.msg{
max-width:88%;
}

.logo{
font-size:14px;
}

}

</style>
</head>

<body>

<div id="loginPage">

<div class="login-box">

<h2>🔒 RPSE Chat</h2>

<p>Password Enter Kare</p>

<input
type="password"
id="password"
placeholder="Password">

<button onclick="checkPassword()">
Login
</button>

<div id="error">
Access Denied
</div>

</div>

</div>
<div id="chatPage">

<div class="logo">
📚 Exam ki tayari ke liye question bheje
</div>

<div id="chat"></div>

<div class="bottom">

<input
id="message"
placeholder="Apna swal type kre ...">

<button
class="askBtn"
onclick="sendMessage()">
Ask
</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js"></script>

<script>

const PASSWORD = "duggubuggu1525";

function checkPassword(){

const pass =
document.getElementById("password").value;

if(pass === PASSWORD){

document.getElementById("loginPage").style.display="none";

document.getElementById("chatPage").style.display="flex";

}else{

document.getElementById("error").style.display="block";

}

}

const socket = io("https://duggu.onrender.com",{
transports:["websocket","polling"]
});

const myId =
Math.random().toString(36).substring(2);

function addMessage(text,type){

const div =
document.createElement("div");

div.className =
`msg ${type}`;

div.innerText = text;

document.getElementById("chat")
.appendChild(div);

document.getElementById("chat")
.scrollTop =
document.getElementById("chat")
.scrollHeight;

}

function sendMessage(){

const input =
document.getElementById("message");

const msg =
input.value.trim();

if(!msg) return;

addMessage(msg,"sent");

socket.emit("send_message",{
text:msg,
sender:myId
});

input.value="";

}

document
.getElementById("message")
.addEventListener("keypress",(e)=>{

if(e.key==="Enter"){

sendMessage();

}

});

socket.on(
"receive_message",
(data)=>{

if(data.sender===myId)
return;

addMessage(
data.text,
"received"
);

});

</script>

</body>
</html>
